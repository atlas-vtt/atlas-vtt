# Maps issue-form answers to labels. Each pattern requires the form question
# heading right before the answer, which rules out casual mentions of an
# option in free text. Pasted copies of another issue body can still match;
# labels are advisory and the maintainer's triage is authoritative.
# Keep the option texts identical to .github/ISSUE_TEMPLATE/*.yml.
"type:bug":
  - '### What kind of issue is this\?\s+Something doesn.t work'
"type:crash":
  - '### What kind of issue is this\?\s+Crash or freeze'
"type:performance":
  - '### What kind of issue is this\?\s+Slow or laggy'
"type:compatibility":
  - '### What kind of issue is this\?\s+Conflict with another plugin or theme'
"type:question":
  - '### What kind of issue is this\?\s+Question or something else'
"area:maps":
  - '### Which part of Atlas is affected\?\s+Maps, scenes and grid'
"area:tokens":
  - '### Which part of Atlas is affected\?\s+Tokens'
"area:notes":
  - '### Which part of Atlas is affected\?\s+Notes, pins and statblocks'
"area:vision":
  - '### Which part of Atlas is affected\?\s+Fog of war and lighting'
"area:combat":
  - '### Which part of Atlas is affected\?\s+Initiative and combat'
"area:dice":
  - '### Which part of Atlas is affected\?\s+Dice'
"area:asset-manager":
  - '### Which part of Atlas is affected\?\s+Asset manager'
"area:player-view":
  - '### Which part of Atlas is affected\?\s+Player view'
"area:settings":
  - '### Which part of Atlas is affected\?\s+Settings, commands and updates'
"area:online":
  - '### Which part of Atlas is affected\?\s+Online play'
"area:unknown":
  - '### Which part of Atlas is affected\?\s+Not sure \/ other'
