name: Build Obsidian Test Release

on:
  push:
    branches:
      - feature/note-to-pin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obsidian-test-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish test release
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build:ci

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/main.js release/main.js
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json
          test -s release/main.js
          test -s release/styles.css
          test -s release/manifest.json

      - name: Create or update GitHub test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="note-to-pin-test-${SHORT_SHA}"
          TITLE="Atlas VTT note-to-pin test build (${SHORT_SHA})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/main.js release/styles.css release/manifest.json \
              --clobber
            gh release edit "$TAG" --title "$TITLE" \
              --notes "Automated Obsidian test build from commit $GITHUB_SHA on branch $GITHUB_REF_NAME."
          else
            gh release create "$TAG" \
              release/main.js release/styles.css release/manifest.json \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --prerelease \
              --notes "Automated Obsidian test build from commit $GITHUB_SHA on branch $GITHUB_REF_NAME."
          fi

          echo "## Test release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assets: main.js, styles.css, manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Open release](https://github.com/$GH_REPO/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
