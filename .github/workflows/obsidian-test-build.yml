name: Build Obsidian Test Plugin

on:
  push:
    branches:
      - feature/note-to-pin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build:ci

      - name: Prepare Obsidian plugin files
        run: |
          mkdir -p obsidian-test-plugin
          cp dist/main.js obsidian-test-plugin/main.js
          cp dist/styles.css obsidian-test-plugin/styles.css
          cp manifest.json obsidian-test-plugin/manifest.json

      - name: Upload test plugin
        uses: actions/upload-artifact@v4
        with:
          name: atlas-vtt-obsidian-test
          path: obsidian-test-plugin/
          if-no-files-found: error
          retention-days: 7
