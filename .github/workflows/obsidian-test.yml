name: Obsidian test build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/note-to-pin
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package plugin
        run: |
          test -f dist/main.js
          test -f dist/style.css
          mkdir -p obsidian-test
          cp dist/main.js dist/style.css manifest.json obsidian-test/
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-vtt-obsidian-test
          path: obsidian-test/
          if-no-files-found: error
