name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The rule set Obsidian's community directory scores the plugin with.
      # Zero tolerance; accepted exceptions live in eslint.suppressions.json.
      - name: Lint
        run: npm run lint

      # Obsidian's directory review lints the whole repository with its own
      # config; a file it cannot parse is a fatal review error.
      - name: Lint like the community directory scan
        run: npm run lint:scan

      - name: Verify release channel (main = stable x.y.z, beta = x.y.z-beta.N)
        run: node scripts/release-channel.js --branch "${{ github.base_ref || github.ref_name }}"

      - name: Check release notes
        run: npm run changelog:check

      - name: Test reporting service
        run: python3 -m unittest discover -s services/issue-reporter

      - name: Test
        run: npx vitest run --project unit

      - name: Check code dependencies
        run: npm run check:boundaries

      - name: Build plugin
        run: npm run build:ci

      - name: Smoke test postbuild hook (used by npm run build)
        run: npm run postbuild

      - name: Preflight (community directory review checks)
        run: npm run preflight

      - name: Prepare installable test build
        run: npm run release:prepare

      - name: Upload plugin test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-vtt-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails a pull request that adds a dependency with a known vulnerability.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
