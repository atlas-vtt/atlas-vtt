name: Build explored-area reset test release

on:
  push:
    branches:
      - feature/explored-area-reset-button
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Obsidian plugin
        run: npm run build

      - name: Verify release files
        run: |
          test -s dist/main.js
          test -s manifest.json
          test -s dist/styles.css

      - name: Create test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: explored-area-reset-test-${{ github.run_number }}
          name: Explored Area Reset Test ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Automated test build for the `feature/explored-area-reset-button` branch.

            Download the three Obsidian plugin files below and replace the corresponding files in your test plugin folder.
          files: |
            dist/main.js
            manifest.json
            dist/styles.css
