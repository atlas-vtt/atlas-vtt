name: Temporary Obsidian Test Build

on:
  push:
    branches:
      - fix/copy-paste-lights
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run the light clipboard tests
        run: npx vitest run --project unit tests/unit/mapClipboard.test.ts

      - name: Build Atlas for Obsidian
        run: npm run build:ci

      - name: Stage Obsidian plugin files
        run: |
          mkdir -p obsidian-plugin
          cp dist/main.js obsidian-plugin/main.js
          cp dist/styles.css obsidian-plugin/styles.css
          cp manifest.json obsidian-plugin/manifest.json
          test -s obsidian-plugin/main.js
          test -s obsidian-plugin/styles.css
          test -s obsidian-plugin/manifest.json

      - name: Upload installable Obsidian plugin files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-vtt-copy-paste-lights-${{ github.sha }}
          path: obsidian-plugin/*
          if-no-files-found: error
          retention-days: 7
