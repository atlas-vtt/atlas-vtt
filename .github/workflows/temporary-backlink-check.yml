name: Temporary backlink regression check

on:
  push:
    branches:
      - feature/note-to-pin
    paths:
      - .github/workflows/temporary-backlink-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run note pin tests
        run: npx vitest run --project unit tests/unit/notePinTool.create.test.ts
      - name: Build plugin
        run: npm run build
