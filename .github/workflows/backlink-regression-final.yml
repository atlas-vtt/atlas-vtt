name: Backlink regression final verification

on:
  push:
    branches:
      - feature/note-to-pin
    paths:
      - .github/workflows/backlink-regression-final.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --project unit tests/unit/notePinTool.create.test.ts
      - run: npm run build
