name: Prepare Plugin Release

# Builds nothing: the draft carries the build that Plugin CI tested on the push
# of this exact commit to `main`. Without a successful run for the commit the
# workflow stops; it never tests or builds again.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare (must match the selected ref manifest, e.g. 0.1.7)'
        required: true
        type: string

concurrency:
  group: plugin-release-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the build of the Plugin CI run
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify stable version from main
        run: |
          node scripts/release-channel.js --expect stable
          test "$RELEASE_VERSION" = "$(node -p "require('./manifest.json').version")" || { echo "::error::Input version $RELEASE_VERSION does not match manifest.json"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Stable releases are only prepared from commits on main. Promote beta first."; exit 1; }

      - name: Refuse published releases or drafts from another commit
        run: |
          if gh release view "$RELEASE_VERSION" --json isDraft,targetCommitish > existing-release.json; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' existing-release.json
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" > /dev/null; then
            git fetch origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$GITHUB_SHA"
          fi

      # Only a push run of this repository on `main` qualifies: pull request
      # runs, forks included, build a merge commit nobody released.
      - name: Find the Plugin CI run that tested this commit on main
        id: ci
        run: |
          gh api -X GET "repos/$GH_REPO/actions/workflows/plugin-ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f per_page=20 > ci-runs.json
          run_id="$(jq -r --arg sha "$GITHUB_SHA" --arg repo "$GH_REPO" '
            [.workflow_runs[]
              | select(.head_sha == $sha and .event == "push" and .head_branch == "main"
                       and .head_repository.full_name == $repo and .conclusion == "success")]
            | first | .id // empty' ci-runs.json)"
          if [ -z "$run_id" ]; then
            jq -r '.workflow_runs[] | "  run \(.id): \(.status) \(.conclusion // "")"' ci-runs.json
            echo "::error::No successful Plugin CI run on main for $GITHUB_SHA. Wait for the push run to finish (or re-run it if it failed), then run this workflow again."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Release assets come from Plugin CI run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id." >> "$GITHUB_STEP_SUMMARY"

      - name: Download the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-vtt-${{ github.sha }}
          path: release/
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the build belongs to this commit
        run: |
          cmp release/manifest.json manifest.json || { echo "::error::The build's manifest.json differs from the commit's."; exit 1; }
          for file in main.js styles.css release-notes.md; do
            test -s "release/$file" || { echo "::error::The build lacks $file."; exit 1; }
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/main.js
            release/styles.css

      - name: Create or refresh draft with verified assets
        run: |
          if gh release view "$RELEASE_VERSION" --json isDraft,targetCommitish > existing-release.json; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' existing-release.json
            gh release edit "$RELEASE_VERSION" --notes-file release/release-notes.md
          else
            gh release create "$RELEASE_VERSION" --draft --target "$GITHUB_SHA" --title "Atlas VTT $RELEASE_VERSION" --notes-file release/release-notes.md
          fi
          gh release upload "$RELEASE_VERSION" release/main.js release/manifest.json release/styles.css --clobber
          gh release view "$RELEASE_VERSION" --json assets --jq '[.assets[].name] | sort' > attached-assets.json
          jq -e '. == ["main.js", "manifest.json", "styles.css"]' attached-assets.json
          echo "Draft $RELEASE_VERSION is ready for review and manual publication." >> "$GITHUB_STEP_SUMMARY"
