name: Temporary manual test build # verification rerun 2

on:
  push:
    branches:
      - feature/note-to-pin
    paths:
      - .github/workflows/temporary-test-build.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run note pin tests
        run: npx vitest run --project unit tests/unit/notePinTool.create.test.ts
      - name: Build plugin
        run: npm run build
      - name: Package test build
        run: |
          mkdir -p test-build
          cp dist/main.js test-build/main.js
          cp dist/styles.css test-build/styles.css
          cp manifest.json test-build/manifest.json
          cd test-build
          zip -r ../atlas-vtt-note-to-pin-test-build.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-vtt-note-to-pin-test-build
          path: atlas-vtt-note-to-pin-test-build.zip
          if-no-files-found: error
          retention-days: 7
