name: Publish Beta Build

# Every push to `beta` whose manifest carries a new x.y.z-beta.N version is
# published as a GitHub pre-release for BRAT testers. Pre-releases are never
# marked "latest", so Obsidian's community directory and stable installs
# cannot see them. Stable releases only come from `plugin-release.yml` on main.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: plugin-beta-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-prerelease:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify beta version
        run: |
          node scripts/release-channel.js --expect beta
          echo "RELEASE_VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"

      - name: Check whether this beta is already published
        id: existing
        env:
          # Empty for manual runs, which always mean "publish this version".
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          skip=false
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" > /dev/null; then
            git fetch --force origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            if [ "$(git rev-list -n 1 "$RELEASE_VERSION")" != "$GITHUB_SHA" ]; then
              # An ordinary merge leaves the version alone: nothing to publish.
              # Only a push that sets the version to an already-used tag is a mistake.
              previous_version=""
              if [ -n "$BEFORE_SHA" ] && git fetch --quiet --depth=1 origin "$BEFORE_SHA" 2>/dev/null; then
                previous_version="$(git show "$BEFORE_SHA:manifest.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
              fi
              if [ "$previous_version" = "$RELEASE_VERSION" ]; then
                echo "Version $RELEASE_VERSION was not bumped by this push; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Tag $RELEASE_VERSION already points at another commit. Bump to the next beta number (npm version prerelease)."
              exit 1
            fi
            if gh release view "$RELEASE_VERSION" --json isPrerelease --jq '.isPrerelease' 2>/dev/null | grep -q true; then
              skip=true
              echo "Beta $RELEASE_VERSION is already published from this commit; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.existing.outputs.skip != 'true'
        run: npm ci

      - name: Validate release notes
        if: steps.existing.outputs.skip != 'true'
        run: npm run changelog:check

      - name: Typecheck
        if: steps.existing.outputs.skip != 'true'
        run: npx tsc --noEmit

      - name: Lint
        if: steps.existing.outputs.skip != 'true'
        run: npm run lint

      - name: Test
        if: steps.existing.outputs.skip != 'true'
        run: npx vitest run --project unit

      - name: Check code dependencies
        if: steps.existing.outputs.skip != 'true'
        run: npm run check:boundaries

      - name: Build plugin
        if: steps.existing.outputs.skip != 'true'
        run: npm run build:ci

      - name: Preflight
        if: steps.existing.outputs.skip != 'true'
        run: npm run preflight

      - name: Prepare release assets and notes
        if: steps.existing.outputs.skip != 'true'
        run: npm run release:prepare

      - name: Attest build provenance
        if: steps.existing.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/main.js
            release/styles.css

      - name: Upload build artifact
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-vtt-${{ env.RELEASE_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release
        if: steps.existing.outputs.skip != 'true'
        run: |
          gh release create "$RELEASE_VERSION" \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Atlas VTT $RELEASE_VERSION (beta)" \
            --notes-file release/release-notes.md \
            release/main.js release/manifest.json release/styles.css
          gh release view "$RELEASE_VERSION" --json assets,isPrerelease,isDraft \
            --jq '{assets: ([.assets[].name] | sort), isPrerelease, isDraft}' > published.json
          jq -e '.isPrerelease == true and .isDraft == false and .assets == ["main.js", "manifest.json", "styles.css"]' published.json
          echo "Published beta $RELEASE_VERSION as a pre-release. BRAT testers receive it on their next update check." >> "$GITHUB_STEP_SUMMARY"
