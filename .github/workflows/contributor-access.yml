name: Contributor Access

# Invites the author of every merged pull request into the organization's
# `contributors` team. The team holds the Triage role on this repository and
# write access to the issue board: its members label, assign and close issues
# and review pull requests, and can neither push, merge, delete issues nor
# change settings. It runs on `pull_request_target`, so this file comes from the
# base branch, and it never checks out or runs anything of the pull request.
#
# CONTRIBUTOR_INVITE_TOKEN is a fine-grained token of an organization owner with
# only the organization permission "Members: read and write". Without it the job
# skips.

on:
  pull_request_target:
    types: [closed]
    branches: [beta, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  invite:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.CONTRIBUTOR_INVITE_TOKEN != '' }}
    steps:
      - name: Invite the author into the contributors team
        id: invite
        if: env.HAS_TOKEN == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CONTRIBUTOR_INVITE_TOKEN }}
          script: |
            const TEAM = 'contributors';
            const org = context.repo.owner;
            const login = context.payload.pull_request.user.login;
            const { data: owners } = await github.rest.orgs.listMembers({ org, role: 'admin' });
            if (owners.some((owner) => owner.login === login)) return;
            try {
              const { data } = await github.rest.teams.getMembershipForUserInOrg({ org, team_slug: TEAM, username: login });
              core.info(`${login} is already in ${TEAM} (${data.state}).`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.teams.addOrUpdateMembershipForUserInOrg({ org, team_slug: TEAM, username: login, role: 'member' });
            core.info(`${login}: ${data.state}`);
            core.setOutput('invited', 'true');

      - name: Tell the author
        if: steps.invite.outputs.invited == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const org = context.repo.owner;
            const login = context.payload.pull_request.user.login;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `Thank you @${login}, this is merged. You are invited to the \`contributors\` team: accept it from your GitHub notifications or https://github.com/orgs/${org}/invitation.`,
                'In the team you can assign yourself and others to issues, label and close them, move them on the issue board and review pull requests. See "Pick something to work on" in CONTRIBUTING.md.',
              ].join('\n\n'),
            });
